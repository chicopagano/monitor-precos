name: Monitor de Precos Automático

on:
  schedule:
    - cron: '0 11 * * *' # Executa diariamente às 11:00 UTC (08:00 no horário de Brasília)
  workflow_dispatch: # Permite executar manualmente a qualquer momento

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar bibliotecas
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 supabase

      - name: Executar script de recolha de preços
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          UAPPI_API_URL: ${{ secrets.UAPPI_API_URL }}
          UAPPI_TOKEN: ${{ secrets.UAPPI_TOKEN }}
          UAPPI_SECRET: ${{ secrets.UAPPI_SECRET }}
        run: python collector.py
